<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tcg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <!-- IMPORTANT: keep ONLY invariant, non-per-page tags in this static shell.
         Per-page title, description, robots meta, and all og/twitter title,
         description, image, url, type, and card tags are emitted per route by
         the SEO component (react-helmet) and appear in each prerendered page's
         head. The per-page title tag and robots meta are intentionally NOT
         duplicated here: a static shell title tag produced a duplicate title
         in every prerendered page (VAL-SEO-006), and a static shell robots
         meta conflicted with the noindex meta on /chat (VAL-SEO-010). The SEO
         component emits the correct robots meta per route (index, follow, ...
         for indexable routes; noindex, nofollow for /chat, /admin, 404). -->
    <meta name="author" content="Christian Perez" />

    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#0A0F1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter — INVARIANT tags only (site_name, locale, card type,
         handle). Per-page og:title/description/image/url + twitter:title/
         description/image and og:image:width/height are emitted per route by <SEO>. -->
    <meta property="og:site_name" content="Christian Perez" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:site" content="@thechrisgrey" />

    <!-- RSS Feed -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Christian Perez - Blog"
      href="https://thechrisgrey.com/rss.xml"
    />

    <!-- Material Icons are now inline SVGs (src/components/icons/Icon.tsx) so
         no render-blocking Google Fonts stylesheet is fetched (VAL-PERF-006). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
