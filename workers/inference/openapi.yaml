openapi: 3.1.0
info:
  title: Private inference gateway
  version: 1.0.0
  description: Server-authenticated Cloudflare Workers AI transport used by the AWS Lambda services. Browser clients continue to use the Lambda APIs.
servers:
  - url: https://thechrisgrey-inference.deltacentric.workers.dev
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Gateway liveness
  /v1/chat/completions:
    post:
      security:
        - GatewayKey: []
      description: Bounded JSON inference with a fixed model, no streaming, no response caching, and an additional gateway rate limit. Lambda callers apply authentication, usage quotas, and applicable AWS guardrails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model:
                  const: '@cf/mistralai/mistral-small-3.1-24b-instruct'
                messages:
                  type: array
                  minItems: 1
                  maxItems: 150
                  items:
                    type: object
                max_tokens:
                  type: integer
                  minimum: 1
                  maximum: 8192
                temperature:
                  type: number
                tools:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                tool_choice: {}
                stream:
                  const: false
      responses:
        '200':
          description: Chat completion choices and token usage
        '400':
          description: Invalid input or request body larger than 256 KiB
        '401':
          description: Missing or invalid server credential
        '404':
          description: Unsupported route or method
        '429':
          description: Gateway request limit exceeded
        '502':
          description: Invalid model response
        '503':
          description: Model service or required binding unavailable
components:
  securitySchemes:
    GatewayKey:
      type: http
      scheme: bearer
