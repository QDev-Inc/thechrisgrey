        detail-type: [Object Created]
        detail:
          bucket:
            name:
              - Fn::ImportValue: thechrisgrey-foundation-KnowledgeBaseSourceBucketName
          object:
            key:
              - prefix: content/
      Targets:
        - Arn: !GetAtt KbSyncFunction.Arn
          Id: KbSyncFunction

