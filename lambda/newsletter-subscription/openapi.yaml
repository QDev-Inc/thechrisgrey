openapi: 3.1.0
info:
  title: thechrisgrey Newsletter Subscription API
  version: 1.0.0
  description: Turnstile-protected confirmation requests. Contacts are activated only after a single-use mailbox confirmation.
paths:
  /:
    get:
      summary: Service health
      responses:
        '200':
          description: Service is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
    post:
      summary: Request confirmation or confirm a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SubscriptionRequest'
                - $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '202':
          description: Confirmation email requested; the contact has not been subscribed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '200':
          description: Mailbox ownership confirmed and the requested subscription activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '503':
          description: Required service configuration is unavailable.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/SubscriptionUnavailable'
components:
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, version]
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: newsletter-subscription
        version:
          type: string
    SubscriptionRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        source:
          type: string
          enum: [newsletter, blueprint]
          default: newsletter
          description: Subscription purpose, retained through confirmation and mapped to a dedicated segment.
        turnstileToken:
          type: string
          description: One-time Cloudflare Turnstile token, required when Turnstile is configured.
    ConfirmationRequest:
      type: object
      required: [confirmationToken]
      properties:
        confirmationToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token sent to the subscriber, valid for 24 hours.
    AcceptedResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    InvalidRequest:
      description: The body was malformed or did not include a valid email address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The origin is not allowed or Turnstile verification failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The sender exceeded the per-IP rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubscriptionUnavailable:
      description: Resend did not accept the subscription request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
